<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mühendis Oluyorum</title>
<meta name="description" content="Uçak ve uzay mühendisliği için konu anlatımları, mülakat kavramları ve testler.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F6F8FB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mühendis Oluyorum">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* ---------- Tema ---------- */
:root{
  --zemin:#F6F8FB; --kart:#FFFFFF; --kart2:#EFF3F8;
  --metin:#14213D; --metin2:#4A5568; --metin3:#6B7686;
  --cizgi:#DCE3EC; --cizgi2:#C9D2DE;
  --rota:#B0127A; --rota-hafif:#FBEAF4;
  --yesil:#1E7B4F; --yesil-hafif:#E8F4ED;
  --kirmizi:#B42318; --kirmizi-hafif:#FDECEA;
  --sari:#8A6200; --sari-hafif:#FFF7E8; --sari-cizgi:#F2D59B;
  --mavi-hafif:#EAF1FA;
  --r:14px; --r-k:10px;
  --ol:1.65;
  --font:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-b:'Source Serif 4',Georgia,'Times New Roman',serif;
  --gt:17px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--zemin);color:var(--metin);
  font-family:var(--font);font-size:var(--gt);line-height:var(--ol);
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body.kilit{user-select:none;-webkit-user-select:none}
h1,h2,h3{font-family:var(--font-b);font-weight:600;line-height:1.25;margin:0}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.08rem}
p{margin:0 0 .85em}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--rota)}
input,textarea,select{font-family:inherit;font-size:1rem;color:var(--metin);
  background:var(--kart);border:1px solid var(--cizgi2);border-radius:var(--r-k);padding:11px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--rota);outline-offset:1px;border-color:var(--rota)}
:focus-visible{outline:2px solid var(--rota);outline-offset:2px}
.gizli{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Düzen ---------- */
#uyg{min-height:100dvh;display:flex;flex-direction:column}
#govde{flex:1;padding:0 18px calc(86px + env(safe-area-inset-bottom));max-width:760px;width:100%;margin:0 auto}
#ust{position:sticky;top:0;z-index:20;background:var(--zemin);
  padding:calc(10px + env(safe-area-inset-top)) 18px 8px;max-width:760px;margin:0 auto;width:100%}
.ust-ic{display:flex;align-items:center;gap:12px;min-height:40px}
.ust-ic .bslk{flex:1;font-size:.92rem;color:var(--metin2);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ikonb{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ikonb:active{background:var(--kart2)}
#ilerleme{height:3px;background:var(--cizgi);border-radius:2px;overflow:hidden;margin-top:8px}
#ilerleme > div{height:100%;background:var(--rota);width:0;transition:width .25s}

/* ---------- Alt menü ---------- */
#menu{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--kart);
  border-top:1px solid var(--cizgi);display:flex;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
#menu button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 2px;font-size:.64rem;color:var(--metin3);line-height:1.3}
#menu button.aktif{color:var(--metin)}
#menu button.aktif .ik{color:var(--rota)}
.ik{width:24px;height:24px;display:block}

/* ---------- Kartlar ---------- */
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.kart-t{padding:0;overflow:hidden}
.rozet{display:inline-block;font-size:.78rem;line-height:1.5;padding:2px 10px;border-radius:999px;
  background:var(--kart2);color:var(--metin);white-space:nowrap}
.rozet.rota{background:var(--rota-hafif);color:var(--rota)}
.rozet.yesil{background:var(--yesil-hafif);color:var(--yesil)}
.rozet.sari{background:var(--sari-hafif);color:var(--sari)}
.rozet.kirmizi{background:var(--kirmizi-hafif);color:var(--kirmizi)}
.rozetler{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:block;width:100%;background:var(--metin);color:#fff;border-radius:var(--r-k);
  padding:13px;text-align:center;font-size:1rem;min-height:48px}
.btn:active{opacity:.85}
.btn.ikincil{background:var(--kart);color:var(--metin);border:1px solid var(--cizgi2)}
.btn.rota{background:var(--rota)}
.btn:disabled{opacity:.45}
.satir{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--cizgi);width:100%;text-align:left;min-height:56px}
.satir:last-child{border-bottom:none}
.kucuk{font-size:.86rem;color:var(--metin2)}
.mini{font-size:.78rem;color:var(--metin3)}

/* ---------- Rota ---------- */
.rota-satir{display:grid;grid-template-columns:28px 1fr;width:100%;text-align:left;padding:0}
.ray{position:relative}
.ray i{position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--cizgi2)}
.ray i.tam{background:var(--rota)}
.ray i.ust{bottom:auto;height:26px}
.ray i.alt{top:26px}
.nokta{position:absolute;left:8px;top:20px;width:12px;height:12px;transform:rotate(45deg);
  background:var(--cizgi2);z-index:1}
.nokta.tam{background:var(--rota)}
.nokta.simdi{background:var(--kart);border:2.5px solid var(--rota);width:16px;height:16px;left:6px;top:18px}
.rota-ic{padding:12px 0 12px 4px}
.rota-satir:first-child .ray i.ust{top:26px;height:0}

/* ---------- Okuma ---------- */
#okuma{max-width:none}
.oku h1{margin:2px 0 10px}
.oku p{font-size:1rem}
.ozet{background:var(--mavi-hafif);border-radius:var(--r);padding:14px 16px;margin-bottom:20px;font-size:1.02rem}
.blm{margin-bottom:26px;scroll-margin-top:80px}
.blm h3{margin-bottom:8px}
.kutu{border-radius:var(--r);padding:13px 15px;margin:14px 0;font-size:.95rem}
.kutu b{display:block;margin-bottom:3px;font-size:.9rem}
.kutu.yanilgi{background:var(--sari-hafif);border:1px solid var(--sari-cizgi);color:#4A3500}
.kutu.yanilgi b{color:var(--sari)}
.kutu.uyari{background:var(--kirmizi-hafif);border:1px solid #F3C6C1;color:#5B1A12}
.kutu.uyari b{color:var(--kirmizi)}
.kutu.bilgi{background:var(--mavi-hafif);border:1px solid #C9DCF2}
.formul{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);
  padding:16px;margin:14px 0;text-align:center;font-family:var(--font-b);font-style:italic;
  font-size:1.15rem;line-height:1.7;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin:12px 0}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--cizgi);vertical-align:top}
th{font-weight:600;color:var(--metin2);font-size:.85rem}
.ornek{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);padding:16px;margin:14px 0}
.ornek .s{font-weight:600;margin-bottom:10px}
.ornek .c{font-size:.95rem;white-space:pre-wrap;color:var(--metin2)}
.mlk{border-left:3px solid var(--rota);padding:2px 0 2px 13px;margin:14px 0}
.mlk .q{font-weight:600;margin-bottom:4px}
.mlk .a{font-size:.95rem;color:var(--metin2)}
.vid{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--cizgi);text-decoration:none;color:inherit}
.vid:last-child{border-bottom:none}
.vid .oy{width:40px;height:40px;border-radius:50%;background:var(--kart2);display:flex;
  align-items:center;justify-content:center;flex-shrink:0}
ol.kay{padding-left:20px;font-size:.88rem;color:var(--metin2)}
ol.kay li{margin-bottom:7px}
svg.cizim{width:100%;height:auto;display:block;margin:6px 0}

/* ---------- Test ---------- */
.sec{display:block;width:100%;text-align:left;background:var(--kart);
  border:1px solid var(--cizgi2);border-radius:var(--r-k);padding:13px 15px;margin-bottom:9px;
  font-size:.98rem;line-height:1.5;min-height:48px}
.sec.dogru{background:var(--yesil-hafif);border-color:var(--yesil);color:#0F4A2E}
.sec.yanlis{background:var(--kirmizi-hafif);border-color:var(--kirmizi);color:#6B1810}
.sec.solgun{color:var(--metin3)}
.gbar{display:flex;gap:5px;margin-bottom:16px}
.gbar span{flex:1;height:4px;background:var(--cizgi);border-radius:2px}
.gbar span.d{background:var(--yesil)}
.gbar span.y{background:var(--kirmizi)}
.gbar span.a{background:var(--rota)}
.puan{font-size:3rem;font-family:var(--font-b);line-height:1.1}
.hata-m{font-size:.86rem;color:var(--kirmizi);min-height:20px;margin:4px 0}

/* ---------- Kaydırmalı haber ---------- */
#haberler{height:calc(100dvh - 150px);overflow-y:auto;scroll-snap-type:y mandatory;
  margin:0 -18px;padding:0 18px}
.haber{scroll-snap-align:start;min-height:calc(100dvh - 160px);display:flex;flex-direction:column;
  justify-content:center;padding:20px 0}

/* ---------- Alt sayfa ---------- */
#ortu{position:fixed;inset:0;background:rgba(20,33,61,.45);z-index:40;display:flex;align-items:flex-end}
#ortu.orta{align-items:center;justify-content:center}
.sayfa{background:var(--kart);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  width:100%;max-width:560px;margin:0 auto;max-height:88dvh;overflow-y:auto}
#ortu.orta .sayfa{border-radius:22px;margin:20px}
.tut{width:38px;height:4px;background:var(--cizgi2);border-radius:2px;margin:0 auto 14px}
.cip{display:inline-block;font-size:.85rem;border:1px solid var(--cizgi2);background:var(--kart);
  padding:8px 13px;border-radius:999px;margin:0 6px 7px 0}
.cip.on{background:var(--metin);color:#fff;border-color:var(--metin)}

/* ---------- Kod ekranı ---------- */
#kapi{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
#kapi .ic{width:100%;max-width:400px}
#kodg{text-align:center;font-size:1.3rem;letter-spacing:2px;height:56px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}
.logo{width:64px;height:64px;border-radius:18px;background:var(--metin);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px}

/* ---------- Geniş ekran ---------- */
@media (min-width:900px){
  #uyg{flex-direction:row}
  #menu{position:sticky;top:0;bottom:auto;height:100dvh;width:216px;flex-direction:column;
    border-top:none;border-right:1px solid var(--cizgi);padding:26px 12px;gap:4px;align-self:flex-start}
  #menu button{flex:none;flex-direction:row;gap:12px;justify-content:flex-start;
    font-size:.95rem;padding:11px 14px;border-radius:var(--r-k)}
  #menu button.aktif{background:var(--kart2)}
  #sag{flex:1;min-width:0}
  #govde{padding-bottom:60px}
  #ust{padding-top:18px}
  #haberler{height:calc(100dvh - 130px)}
  .haber{min-height:calc(100dvh - 150px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body class="kilit">

<div id="kapi">
  <div class="ic">
    <div style="text-align:center;margin-bottom:26px">
      <div class="logo">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
          <path d="M12 2.5c.7 0 1.2.9 1.2 2v5.1l7.3 4.3v1.8l-7.3-2.3v4.4l2.4 1.7v1.5L12 20l-3.6.9v-1.5l2.4-1.7v-4.4l-7.3 2.3v-1.8l7.3-4.3V4.5c0-1.1.5-2 1.2-2z"/>
        </svg>
      </div>
      <h1>Mühendis Oluyorum</h1>
      <p class="kucuk" style="margin-top:6px">Uçak ve uzay mühendisliği</p>
    </div>
    <p style="font-size:.97rem">Sana gönderilen davet kodunu gir. Bu kodu bir kez girmen yeterli.</p>
    <label class="sr" for="kodg">Davet kodu</label>
    <input id="kodg" placeholder="UCAK-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
    <div id="kodh" class="hata-m" role="alert"></div>
    <button class="btn" id="kodb">Devam et</button>
    <p class="mini" style="text-align:center;margin-top:18px">
      Kodun mu yok? Uygulamayı sana ileten kişiden isteyebilirsin.<br>
      <button id="kvkkb" style="text-decoration:underline;font-size:.78rem;color:var(--metin3);padding:6px">Verilerin nasıl saklanıyor?</button>
    </p>
  </div>
</div>

<div id="uyg" class="gizli">
  <nav id="menu" aria-label="Ana menü"></nav>
  <div id="sag" style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header id="ust"></header>
    <main id="govde"></main>
  </div>
</div>

<script src="content.js"></script>
<script src="kavramlar_ek.js"></script>
<script>
/* =======================================================================
   Mühendis Oluyorum — uygulama mantığı
   ======================================================================= */
(function(){
"use strict";
const C = window.CONTENT;
  if (window.KAVRAMLAR_EK) C.kavramlar = C.kavramlar.concat(window.KAVRAMLAR_EK);
const $ = s => document.querySelector(s);
const el = id => document.getElementById(id);

/* ---------------- Depolama ---------------- */
const Depo = (function(){
  let bellek = {};
  let calisir = true;
  try { localStorage.setItem("_t","1"); localStorage.removeItem("_t"); }
  catch(e){ calisir = false; }
  return {
    al(k, v){
      try { const x = calisir ? localStorage.getItem(k) : bellek[k];
            return x == null ? v : JSON.parse(x); }
      catch(e){ return v; }
    },
    yaz(k, v){
      const s = JSON.stringify(v);
      try { if (calisir) localStorage.setItem(k, s); else bellek[k] = s; }
      catch(e){ bellek[k] = s; }
    }
  };
})();

const D = {
  kod:      Depo.al("mo.kod", null),
  brans:    Depo.al("mo.brans", null),
  ilerleme: Depo.al("mo.ilerleme", {}),
  kaydedilen: Depo.al("mo.kaydedilen", []),
  eksikler: Depo.al("mo.eksikler", []),
  kavram:   Depo.al("mo.kavram", { zaman:0, indeks:0, ogrenildi:false, hak:30 }),
  ayar:     Depo.al("mo.ayar", { yazi:17, serif:false }),
  sonKonu:  Depo.al("mo.sonKonu", null)
};
function kaydet(a){ Depo.yaz("mo."+a, D[a]); }

/* ---------------- Yardımcılar ---------------- */
function e(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function par(t){ return String(t).split(/\n\n+/).map(p=>"<p>"+e(p).replace(/\n/g,"<br>")+"</p>").join(""); }
function bugun(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function ikon(n,b){ b=b||24; const P={
  ev:"M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z",
  kitap:"M4 4h9a3 3 0 013 3v13a2 2 0 00-2-2H4z M20 4h-4v14h4z",
  rozet:"M12 2l3 3h4v4l3 3-3 3v4h-4l-3 3-3-3H5v-4l-3-3 3-3V5h4z",
  pusula:"M12 2a10 10 0 100 20 10 10 0 000-20z M15.5 8.5l-2 5-5 2 2-5z",
  haber:"M4 4h13v16H5a1 1 0 01-1-1z M17 9h3v9a2 2 0 01-3 1.7 M7 8h7M7 12h7M7 16h4",
  sol:"M15 5l-7 7 7 7", sag:"M9 5l7 7-7 7",
  ayar:"M12 8a4 4 0 100 8 4 4 0 000-8z M19 12l2 2-2 3.5-2.7-.6-2 1.6-.6 2.7h-3.4l-.6-2.7-2-1.6-2.7.6L3 14l2-2-2-2 2-3.5 2.7.6 2-1.6L10.3 3h3.4l.6 2.7 2 1.6 2.7-.6L21 10z",
  imle:"M6 3h12v18l-6-4.5L6 21z", onay:"M4 12l5 5L20 6",
  yenile:"M3 12a9 9 0 0115.5-6.2M21 12a9 9 0 01-15.5 6.2M18 3v5h-5M6 21v-5h5",
  bayrak:"M5 21V4h12l-2 4 2 4H5", yazi:"M5 19l6-14h2l6 14M8 14h8",
  ekle:"M12 5v14M5 12h14", liste:"M4 6h16M4 12h16M4 18h10",
  oynat:"M7 4l12 8-12 8z", kapat:"M6 6l12 12M18 6L6 18",
  ok:"M5 12h14M13 6l6 6-6 6", uyari:"M12 3l9 17H3z M12 9v5M12 17v.5",
  arama:"M11 4a7 7 0 100 14 7 7 0 000-14z M20 20l-4-4",
  profil:"M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2 M12 11a4 4 0 100-8 4 4 0 000 8z",
  kalem:"M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7 M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z",
  not:"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6 M16 13H8M16 17H8M10 9H8"
}; return '<svg class="ik" width="'+b+'" height="'+b+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+P[n]+'"/></svg>'; }

/* ---------------- Yönlendirme ---------------- */
let yol = { s:"ana" };
let gecmis = [];
const Sekmeler = [
  { id:"ana",   ad:"Ana sayfa",   ik:"ev" },
  { id:"ogren", ad:"Öğren",       ik:"kitap" },
  { id:"kesfet",ad:"Keşfet",      ik:"pusula" },
  { id:"ben",   ad:"Ben",         ik:"profil" }
];
function git(y, geriYok){
  if (!geriYok && yol.s) gecmis.push(JSON.parse(JSON.stringify(yol)));
  yol = y; ciz(); window.scrollTo(0,0);
  const g = el("govde"); if (g) g.scrollTop = 0;
}
function geri(){
  if (gecmis.length){ yol = gecmis.pop(); ciz(); window.scrollTo(0,0); }
  else git({s:"ana"}, true);
}
function sekme(id){ gecmis = []; git({s:id}, true); }

/* ---------------- Kod ekranı ---------------- */
function kodDogrula(){
  const ham = el("kodg").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  const h = el("kodh");
  if (!ham){ h.textContent = "Davet kodunu gir."; return; }
  if (C.demoKodlar.indexOf(ham) === -1){
    h.innerHTML = "Bu kod geçerli değil. Harfleri ve rakamları kontrol et.<br>" +
      '<span style="color:var(--metin3)">Deneme kodu: UCAK-7K3M-92QD</span>';
    return;
  }
  D.kod = ham; kaydet("kod");
  el("kapi").classList.add("gizli");
  el("uyg").classList.remove("gizli");
  ciz();
}
el("kodb").addEventListener("click", kodDogrula);
el("kodg").addEventListener("keydown", ev => { if (ev.key === "Enter") kodDogrula(); });
el("kodg").addEventListener("input", () => { el("kodh").textContent = ""; });
el("kvkkb").addEventListener("click", kvkkGoster);

function kvkkGoster(){
  ac('<h2>Verilerin nasıl saklanıyor?</h2>' +
    '<p class="kucuk" style="margin-top:10px">Bu uygulama isim, e-posta veya telefon numarası toplamaz.</p>' +
    '<p class="kucuk">Saklanan tek şeyler: kullandığın davet kodu, cihazını tanıyan rastgele bir kimlik ve kendi ilerlemen (okuduğun konular, test sonuçların, kaydettiğin kartlar).</p>' +
    '<p class="kucuk">Bu veriler sadece ilerlemeni cihazlar arasında taşımak ve uygulamanın ne kadar kullanıldığını görmek için tutulur. Üçüncü kişilerle paylaşılmaz, reklam amacıyla kullanılmaz.</p>' +
    '<p class="kucuk">Verilerinin silinmesini istersen uygulamayı sana ileten kişiye davet kodunu bildirmen yeterlidir.</p>' +
    '<button class="btn ikincil" onclick="window.__kapat()" style="margin-top:14px">Kapat</button>');
}

/* ---------------- Alt sayfa ---------------- */
function ac(html, orta){
  kapat();
  const o = document.createElement("div");
  o.id = "ortu"; if (orta) o.className = "orta";
  o.innerHTML = '<div class="sayfa" role="dialog" aria-modal="true">' +
    (orta ? "" : '<div class="tut"></div>') + html + "</div>";
  o.addEventListener("click", ev => { if (ev.target === o) kapat(); });
  document.body.appendChild(o);
  document.body.style.overflow = "hidden";
}
function kapat(){
  const o = el("ortu"); if (o) o.remove();
  document.body.style.overflow = "";
}
window.__kapat = kapat;

/* ---------------- İlerleme ---------------- */
function konuDurum(id){ return D.ilerleme[id] || null; }
function tamamlandiMi(id){ const x = konuDurum(id); return !!(x && x.puan >= 80); }
function dersIlerleme(d){
  const hazir = d.konular.filter(k => k.durum === "hazir");
  const bitti = hazir.filter(k => tamamlandiMi(k.id)).length;
  return { bitti:bitti, toplam:d.konular.length, hazir:hazir.length };
}
function aktifDersler(){
  return C.dersler.filter(d => !D.brans || d.branslar.indexOf(D.brans) !== -1);
}

/* ---------------- Çizim ---------------- */
function ciz(){
  if (!D.kod){ el("kapi").classList.remove("gizli"); el("uyg").classList.add("gizli"); return; }
  if (!D.brans){ bransEkrani(); return; }
  document.documentElement.style.setProperty("--gt", D.ayar.yazi + "px");
  document.documentElement.style.setProperty("--ol", D.ayar.serif ? "1.75" : "1.65");
  menuCiz();
  const g = el("govde"), u = el("ust");
  const S = yol.s;
  if (S === "ana")          { ustCiz(null, "Mühendis Oluyorum"); anaSayfa(g); }
  else if (S === "ogren")   { ustCiz(null, "Öğren"); ogrenSayfa(g); }
  else if (S === "ders")    { ustCiz(geri, "Öğren"); dersSayfa(g); }
  else if (S === "konu")    { konuSayfa(g, u); }
  else if (S === "test")    { ustCiz(geri, "Test"); testSayfa(g); }
  else if (S === "kesfet")  { ustCiz(null, "Keşfet"); kesfetSayfa(g); }
  else if (S === "gk")      { ustCiz(geri, "Genel kültür"); gkSayfa(g); }
  else if (S === "gkkonu")  { gkKonuSayfa(g, u); }
  else if (S === "firma")   {
    if (yol.urun != null){
      const f = C.firmalar.find(x => x.id === yol.id);
      ustCiz(() => git({s:"firma", id:yol.id}), f ? f.ad : "Firmalar");
    } else if (yol.id){
      ustCiz(() => git({s:"firma"}), "Firmalar");
    } else {
      ustCiz(geri, "Firmalar");
    }
    firmaSayfa(g);
  }
  else if (S === "haber")   { ustCiz(geri, "Haberler"); haberSayfa(g); }
  else if (S === "eksik")   { ustCiz(geri, "Eksiklerim"); eksikSayfa(g); }
  else if (S === "ben")     { ustCiz(null, "Ben"); benSayfa(g); }
  else if (S === "notlar")  { ustCiz(geri, "Notlarım"); notlarSayfa(g); }
  else if (S === "ayar")    { ustCiz(geri, "Ayarlar"); ayarSayfa(g); }
}

function menuCiz(){
  const m = el("menu");
  const kok = { ana:"ana", ogren:"ogren", ders:"ogren", konu:"ogren", test:"ogren",
    eksik:"ben", kesfet:"kesfet", firma:"kesfet", haber:"kesfet",
    ben:"ben", ayar:"ben", notlar:"ben" }[yol.s] || "";
  m.innerHTML = Sekmeler.map(s =>
    '<button data-s="'+s.id+'" class="'+(kok===s.id?"aktif":"")+'" aria-current="'+(kok===s.id?"page":"false")+'">'+
    ikon(s.ik)+'<span>'+s.ad+'</span></button>').join("");
  m.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => sekme(b.dataset.s)));
}

function ustCiz(geriFn, baslik, sag, oran){
  const u = el("ust");
  u.innerHTML = '<div class="ust-ic">' +
    (geriFn ? '<button class="ikonb" id="gb" aria-label="Geri">'+ikon("sol")+'</button>' : '<span style="width:40px"></span>') +
    '<span class="bslk">'+e(baslik)+'</span>' +
    (sag || '<span style="width:40px"></span>') +
    '</div>' + (oran != null ? '<div id="ilerleme"><div style="width:'+oran+'%"></div></div>' : "");
  if (geriFn) el("gb").addEventListener("click", geriFn);
}

/* ---------------- Branş seçimi ---------------- */
function bransEkrani(){
  el("govde").innerHTML = "";
  el("ust").innerHTML = "";
  el("menu").innerHTML = "";
  const g = el("govde");
  g.innerHTML = '<div style="padding-top:40px"><h1>Hangi alandasın?</h1>' +
    '<p class="kucuk" style="margin:8px 0 22px">Dersler ve örnekler seçimine göre düzenlenir. Bunu sonra ayarlardan değiştirebilirsin.</p>' +

      '<button class="kart" data-b="'+b.id+'" style="display:block;width:100%;text-align:left">' +

      '<div class="kucuk" style="margin-top:4px">'+e(b.aciklama)+'</div></button>').join("") +
    '</div>';

function kurulumGoster(){
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const kurulu = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
  if (kurulu) return;
  const icTarayici = /FBAN|FBAV|Instagram|Line|WhatsApp|Twitter/i.test(navigator.userAgent);
  let h = '<h2>Ana ekrana ekle</h2><p class="kucuk" style="margin-top:10px">' +
    'Uygulamayı ana ekranına eklersen tam ekran açılır, çevrimdışı çalışır ve bildirim alabilirsin.</p>';
  if (icTarayici){
    h += '<div class="kutu uyari"><b>Önce tarayıcıda aç</b>Bu sayfa bir uygulama içinden açıldı. ' +
      'Sağ üstteki menüden "Tarayıcıda aç" seçeneğini kullan, sonra buraya dön.</div>';
  }
  if (iOS){
    h += '<ol class="kucuk" style="padding-left:20px;line-height:2">' +
      '<li>Alttaki <b>Paylaş</b> düğmesine bas</li>' +
      '<li>Listeden <b>Ana Ekrana Ekle</b> seçeneğini bul</li>' +
      '<li><b>Ekle</b> deyip onayla</li></ol>';
  } else {
    h += '<ol class="kucuk" style="padding-left:20px;line-height:2">' +
      '<li>Tarayıcının sağ üstündeki <b>menüyü</b> aç</li>' +
      '<li><b>Uygulamayı yükle</b> veya <b>Ana ekrana ekle</b> seçeneğine bas</li>' +
      '<li>Onayla</li></ol>';
  }
  h += '<button class="btn" onclick="window.__kapat()" style="margin-top:12px">Anladım</button>';
  setTimeout(() => ac(h), 350);
}

/* ---------------- Ana sayfa ---------------- */
function gununKavrami(){
  if (!uygunKavramlar().length) return null;
  const simdi = Date.now();
  if (simdi - D.kavram.zaman >= 86400000){
    const g = Math.floor(simdi / 86400000);
    D.kavram = { zaman:simdi, indeks:g % uygunKavramlar().length, ogrenildi:false, hak:30 };
    kaydet("kavram");
  }
  return uygunKavramlar()[D.kavram.indeks % uygunKavramlar().length];
}
function uygunKavramlar(){
  const l = C.kavramlar.filter(k => !D.brans || k.branslar.indexOf(D.brans) !== -1);
  return l.length ? l : C.kavramlar;
}

  if (kayb) kayb.addEventListener("click", () => {
    const i = D.kaydedilen.indexOf(k.id);
    if (i === -1) D.kaydedilen.push(k.id); else D.kaydedilen.splice(i,1);
    kaydet("kaydedilen"); ciz();
  });
  const yb = el("yenib");
  if (yb) yb.addEventListener("click", () => {

  });
  const db = el("devam");

function ist(ad, s){

    '<div class="mini">'+e(ad)+'</div><div style="font-size:1.5rem;font-weight:600;line-height:1.3">'+s+'</div></div>';

function konuBul(id){

function dersSayfa(g){
  const d = C.dersler.find(x => x.id === yol.id);
  if (!d){ git({s:"ogren"}, true); return; }
  const p = dersIlerleme(d);
  const y = p.hazir ? Math.round(100 * p.bitti / p.hazir) : 0;
  const puanlar = d.konular.map(k => konuDurum(k.id)).filter(Boolean).map(x => x.puan);
  const ort = puanlar.length ? Math.round(puanlar.reduce((a,b)=>a+b,0) / puanlar.length) : null;

  let h = '<h1 style="margin:6px 0 4px">'+e(d.ad)+'</h1>' +
    '<p class="kucuk" style="margin-bottom:16px">'+e(d.aciklama)+'</p>';

  if (!d.konular.length){
    h += '<div class="kart" style="text-align:center;padding:28px 16px">' +
      '<div style="font-size:1.6rem;margin-bottom:8px">🛠️</div>' +
      '<div style="font-weight:600;margin-bottom:4px">Bu modülün dersleri hazırlanıyor</div>' +
      '<div class="mini">İçerik eklendikçe burada listelenecek.</div></div>';
    g.innerHTML = h;
    return;
  }

  h += '<div class="kart"><div style="display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:8px">' +
      '<span>Rotadaki ilerlemen</span><span class="kucuk">'+p.bitti+' / '+p.toplam+'</span></div>' +
      '<div style="height:4px;background:var(--cizgi);border-radius:2px">' +
      '<div style="width:'+y+'%;height:4px;background:var(--rota);border-radius:2px"></div></div>' +
      (ort != null ? '<div class="mini" style="margin-top:8px">Ortalama test puanın %'+ort+'</div>' : "") +
    '</div>';

  const simdiIx = d.konular.findIndex(k => k.durum === "hazir" && !tamamlandiMi(k.id));
  h += d.konular.map((k, i) => {
    const bitti = tamamlandiMi(k.id);
    const simdi = i === simdiIx;
    const dr = konuDurum(k.id);
    const ilk = i === 0, son = i === d.konular.length - 1;
    let noktaS = bitti ? "tam" : (simdi ? "simdi" : "");
    let ustS = bitti || simdi ? (i <= simdiIx || bitti ? "tam" : "") : "";
    let altS = bitti ? "tam" : "";
    let ic;
    if (simdi){
      ic = '<div class="kart" style="margin:4px 0 12px">' +
        '<div class="mini" style="color:var(--rota);margin-bottom:2px">Şu an buradasın</div>' +
        '<div style="font-weight:600;font-size:1.08rem">'+e(k.ad)+'</div>' +
        '<div class="rozetler" style="margin:8px 0 12px"><span class="rozet">'+k.sure+' dakika</span>' +
          '<span class="rozet">'+e(k.seviye)+'</span>' +
          (k.mulakat ? '<span class="rozet sari">Mülakatta sık sorulur</span>' : "") + '</div>' +
        '<div class="btn">'+(dr ? "Devam et" : "Konuya başla")+'</div></div>';
    } else {
      ic = '<div class="rota-ic"><div style="font-weight:500;'+(k.durum!=="hazir"?"color:var(--metin2)":"")+'">'+e(k.ad)+'</div>' +
        '<div class="mini" style="margin-top:2px">' +
        (bitti ? '<span style="color:var(--yesil)">Tamamlandı, %'+dr.puan+'</span>'
               : (k.durum === "hazir" ? (dr ? "Başlandı, %"+dr.puan : k.sure+" dakika")
                                      : "Yakında")) + '</div></div>';
    }
    return '<button class="rota-satir" data-k="'+k.id+'" data-h="'+(k.durum==="hazir"?1:0)+'">' +
      '<div class="ray">' +
        (ilk ? "" : '<i class="ust '+ustS+'"></i>') +
        (son ? "" : '<i class="alt '+altS+'"></i>') +
        '<span class="nokta '+noktaS+'"></span></div>' + ic + '</button>';
  }).join("");

  g.innerHTML = h;
  g.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.h === "1") git({ s:"konu", id:b.dataset.k });
    else ac('<h2>Bu konu henüz hazır değil</h2><p class="kucuk" style="margin-top:10px">' +
      'İçerik hazırlandıkça uygulamaya eklenecek. Hazır konulardan devam edebilirsin.</p>' +
      '<button class="btn ikincil" onclick="window.__kapat()" style="margin-top:12px">Tamam</button>');
  }));
}

function bolumCiz(b){
  let h = '<section class="blm" id="blm-'+e(b.id)+'">';
  if (b.tip === "ozet"){
    h += '<div class="ozet">'+e(b.metin)+'</div>';
  } else {
    if (b.baslik) h += "<h3>"+e(b.baslik)+"</h3>";
    if (b.tip === "formul"){
      h += '<div class="formul">'+e(b.formul)+'</div>' +
        '<table><thead><tr><th>Sembol</th><th>Anlamı</th><th>Birim</th></tr></thead><tbody>' +
        b.semboller.map(s => "<tr><td>"+e(s[0])+"</td><td>"+e(s[1])+"</td><td>"+e(s[2])+"</td></tr>").join("") +
        "</tbody></table>";
      if (b.metin) h += par(b.metin);
    }
    else if (b.tip === "tablo"){
      h += "<table><thead><tr>" + b.basliklar.map(x => "<th>"+e(x)+"</th>").join("") + "</tr></thead><tbody>" +
        b.satirlar.map(r => "<tr>" + r.map(c => "<td>"+e(c)+"</td>").join("") + "</tr>").join("") + "</tbody></table>";
      if (b.metin) h += par(b.metin);
    }
    else if (b.tip === "ornek"){
      h += '<div class="ornek"><div class="s">'+e(b.soru)+'</div><div class="c">'+e(b.cozum)+'</div></div>';
    }
    else if (b.tip === "liste"){
      h += "<ul style='padding-left:20px;font-size:.97rem'>" +
        b.maddeler.map(m => "<li style='margin-bottom:7px'>"+e(m)+"</li>").join("") + "</ul>";
    }
    else if (b.tip === "mulakat"){
      h += b.sorular.map(s => '<div class="mlk"><div class="q">'+e(s[0])+'</div><div class="a">'+e(s[1])+'</div></div>').join("");
    }
    else if (b.tip === "kaynakca"){
      h += '<ol class="kay">' + b.maddeler.map(m => "<li>"+e(m)+"</li>").join("") + "</ol>";
    }
    else if (b.tip === "video"){
      h += b.videolar.map(v =>
        '<a class="vid" href="'+e(v.url)+'" target="_blank" rel="noopener">' +
        '<span class="oy">'+ikon("oynat",18)+'</span><span style="min-width:0">' +
        '<span style="display:block;font-weight:600;font-size:.97rem">'+e(v.ad)+'</span>' +
        '<span class="mini" style="display:block">'+e(v.kanal)+' · '+e(v.dil)+'</span>' +
        '<span class="kucuk" style="display:block;margin-top:3px">'+e(v.not)+'</span></span></a>').join("");
    }
    else if (b.tip === "gorsel"){
      h += cizim(b.gorsel);
      if (b.metin) h += par(b.metin);
    }
    else {
      if (b.metin) h += par(b.metin);
    }
  }
  if (b.kutu) h += '<div class="kutu '+e(b.kutu.tip)+'"><b>'+e(b.kutu.baslik)+'</b>'+e(b.kutu.metin)+'</div>';
  return h + "</section>";
}

function okumaIzle(){
  const bar = el("ilerleme"); if (!bar) return;
  const ic = bar.firstElementChild;
  const g = el("govde");
  function guncelle(){
    const h = document.documentElement;
    const top = window.scrollY || h.scrollTop;
    const max = Math.max(1, h.scrollHeight - h.clientHeight);
    ic.style.width = Math.min(100, Math.round(100 * top / max)) + "%";
  }
  window.removeEventListener("scroll", window.__izle);
  window.__izle = guncelle;
  window.addEventListener("scroll", guncelle, { passive:true });
  guncelle();
}

function bildirimFormu(konuAd, bolumler, surum){
  const turler = ["Bilgi yanlış","Formül veya hesap hatası","Sorunun cevabı yanlış","Kaynak veya bağlantı","Anlaşılmıyor"];
  let secili = null;
  ac('<h2>Hata bildir</h2>' +
    '<p class="mini" style="margin:6px 0 14px">'+e(konuAd)+' · sürüm '+e(surum)+'</p>' +
    '<label class="kucuk" for="bblm">Hangi bölüm?</label>' +
    '<select id="bblm" style="margin:5px 0 14px"><option>Tüm sayfa</option>' +
      bolumler.filter(b => b.baslik).map(b => '<option>'+e(b.baslik)+'</option>').join("") + '</select>' +
    '<div class="kucuk" style="margin-bottom:7px">Hata türü</div>' +
    '<div id="btur">' + turler.map((t,i) => '<button class="cip" data-t="'+i+'">'+e(t)+'</button>').join("") + '</div>' +
    '<div class="hata-m" id="be1" role="alert"></div>' +
    '<label class="kucuk" for="bac">Neyin yanlış olduğunu düşünüyorsun?</label>' +
    '<textarea id="bac" rows="3" style="margin:5px 0 0;resize:none" placeholder="Örnek: Torricelli örneğinde boşalma katsayısı delik şekline göre değişir"></textarea>' +
    '<div class="hata-m" id="be2" role="alert"></div>' +
    '<label class="kucuk" for="bkay">Doğrusunu nereden biliyorsun? (isteğe bağlı)</label>' +
    '<input id="bkay" style="margin:5px 0 16px" placeholder="Kitap adı veya bağlantı">' +
    '<button class="btn" id="bgon">Bildirimi gönder</button>' +
    '<button class="btn ikincil" onclick="window.__kapat()" style="margin-top:9px">Vazgeç</button>');

  el("btur").querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => {
    secili = +b.dataset.t; el("be1").textContent = "";
    el("btur").querySelectorAll(".cip").forEach(x => x.classList.toggle("on", x === b));
  }));
  el("bac").addEventListener("input", () => { el("be2").textContent = ""; });
  el("bgon").addEventListener("click", () => {
    let ok = true;
    if (secili === null){ el("be1").textContent = "Bir hata türü seç."; ok = false; }
    if (el("bac").value.trim().length < 10){ el("be2").textContent = "Neyin yanlış olduğunu biraz daha açıkla."; ok = false; }
    if (!ok) return;
    /* Sunucu bağlandığında: POST /bildirim { kod, konu, bolum, tur, aciklama, kaynak, surum } */
    const kuyruk = Depo.al("mo.bildirimKuyruk", []);
    kuyruk.push({ konu:konuAd, bolum:el("bblm").value, tur:turler[secili],
      aciklama:el("bac").value.trim(), kaynak:el("bkay").value.trim(),
      surum:surum, zaman:new Date().toISOString() });
    Depo.yaz("mo.bildirimKuyruk", kuyruk);
    ac('<div style="text-align:center;padding:10px 0 4px">' +
      '<div style="color:var(--yesil);margin-bottom:8px">'+ikon("onay",38)+'</div>' +
      '<h2>Bildirimin alındı</h2>' +
      '<p class="kucuk" style="margin:8px 0 18px">İnceleyip sonucunu sana bildireceğiz. Katkın için teşekkürler.</p>' +
      '<button class="btn ikincil" onclick="window.__kapat()">Sayfaya dön</button></div>', true);
  });
}

/* ---------------- Test ---------------- */
let T = null;
function testSayfa(g){
  const kaynak = yol.tip === "gk" ? C.genelKultur.icerik[yol.id] : C.konuIcerik[yol.id];
  if (!kaynak){ geri(); return; }
  if (!T || T.id !== yol.id){
    const hepsi = kaynak.sorular.slice();
    const n = Math.min(6, hepsi.length);
    for (let i = hepsi.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [hepsi[i],hepsi[j]]=[hepsi[j],hepsi[i]]; }
    T = { id:yol.id, tip:yol.tip, ad:kaynak.ad, sorular:hepsi.slice(0,n),
          ix:0, cevaplar:[], ipuclari:kaynak.ipuclari || {} };
  }
  if (T.ix >= T.sorular.length){ sonucCiz(g); return; }

  const s = T.sorular[T.ix];
  const verildi = T.cevaplar[T.ix] != null;
  let h = '<div class="gbar">' + T.sorular.map((_,i) => {
    if (i < T.cevaplar.length && T.cevaplar[i] != null)
      return '<span class="'+(T.cevaplar[i] === T.sorular[i].dogru ? "d" : "y")+'"></span>';
    return '<span class="'+(i === T.ix ? "a" : "")+'"></span>';
  }).join("") + '</div>';

  h += '<div class="mini" style="margin-bottom:6px">Soru '+(T.ix+1)+' / '+T.sorular.length+' · '+e(s.etiket)+'</div>' +
    '<div style="font-size:1.08rem;font-weight:600;line-height:1.5;margin-bottom:16px">'+e(s.soru)+'</div>';

  h += s.secenekler.map((o,i) => {
    let c = "sec";
    if (verildi){
      if (i === s.dogru) c += " dogru";
      else if (i === T.cevaplar[T.ix]) c += " yanlis";
      else c += " solgun";
    }
    return '<button class="'+c+'" data-o="'+i+'"'+(verildi?" disabled":"")+'>'+e(o)+'</button>';
  }).join("");

  if (verildi){
    const d = T.cevaplar[T.ix] === s.dogru;
    h += '<div class="kutu '+(d?"bilgi":"yanilgi")+'" style="margin-top:14px">' +
      '<b style="color:'+(d?"var(--yesil)":"var(--sari)")+'">'+(d?"Doğru":"Yanlış")+'</b>'+e(s.aciklama)+'</div>' +
      '<button class="btn" id="ileri" style="margin-top:8px">' +
      (T.ix === T.sorular.length - 1 ? "Sonucu gör" : "Sonraki soru") + '</button>';
  }
  g.innerHTML = h;

  g.querySelectorAll("[data-o]").forEach(b => b.addEventListener("click", () => {
    T.cevaplar[T.ix] = +b.dataset.o; ciz();
  }));
  const il = el("ileri");
  if (il) il.addEventListener("click", () => { T.ix++; ciz(); });
}

function sonucCiz(g){
  let alinan = 0, toplam = 0;
  const kayip = {};
  T.sorular.forEach((s,i) => {
    toplam += s.puan;
    if (T.cevaplar[i] === s.dogru) alinan += s.puan;
    else kayip[s.etiket] = (kayip[s.etiket] || 0) + s.puan;
  });
  const p = Math.round(100 * alinan / toplam);

  const onceki = D.ilerleme[T.id];
  D.ilerleme[T.id] = { puan: Math.max(p, onceki ? onceki.puan : 0), zaman: Date.now() };
  kaydet("ilerleme");

  Object.keys(kayip).forEach(et => {
    if (!D.eksikler.find(x => x.konu === T.id && x.etiket === et))
      D.eksikler.push({ konu:T.id, konuAd:T.ad, etiket:et, ipucu:T.ipuclari[et] || "", zaman:Date.now() });
  });
  if (p >= 80) D.eksikler = D.eksikler.filter(x => x.konu !== T.id || kayip[x.etiket]);
  kaydet("eksikler");

  let sv, renk;
  if (p >= 80){ sv = "Mülakata hazırsın. Konu tamamlandı olarak işaretlendi."; renk = "var(--yesil)"; }
  else if (p >= 50){ sv = "İyi gidiyorsun, birkaç eksiğin var."; renk = "var(--sari)"; }
  else { sv = "Konuyu bir kez daha gözden geçirmeni öneririm."; renk = "var(--kirmizi)"; }

  let h = '<div class="kart" style="text-align:center;padding:24px 18px">' +
    '<div class="kucuk">Konu sonu puanın</div><div class="puan">%'+p+'</div>' +
    '<div style="color:'+renk+';font-size:.97rem;margin-top:4px">'+e(sv)+'</div></div>';

  const et = Object.keys(kayip);
  if (et.length){
    h += '<div class="kart"><h3 style="margin-bottom:10px">Eksiklerin</h3>' +
      et.map(x => '<div style="border-top:1px solid var(--cizgi);padding:11px 0">' +
        '<div style="font-weight:600;font-size:.96rem">'+e(x)+
        ' <span class="mini" style="font-weight:400">· '+kayip[x]+' puan kaybı</span></div>' +
        (T.ipuclari[x] ? '<div class="kucuk" style="margin-top:3px">'+e(T.ipuclari[x])+'</div>' : "") +
        '</div>').join("") +

              '<button onclick="galeriAdim(1)" style="width:32px;height:32px;border-radius:50%;background:rgba(20,33,61,.6);color:#fff;font-size:1rem;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer">›</button>' +
              '</div>'
            : "") +
        '</div>' +
        (p.gorselKredisi ? '<div class="mini" style="margin-top:4px;text-align:right">'+e(p.gorselKredisi)+'</div>' : '') +
      '</div>';
    }

    h += '<p style="font-size:.97rem;margin-bottom:18px">'+e(p.ozet)+'</p>';

      h += '<h3 style="margin-bottom:10px">Teknik özellikler</h3>' +
        '<div class="kart" style="padding:0 18px">' +
        p.teknik.map(r => '<div style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--cizgi)">' +
          '<span class="kucuk" style="flex-shrink:0">'+e(r[0])+'</span>' +
          '<span style="font-weight:500;text-align:right;font-size:.95rem">'+e(r[1])+'</span></div>').join("") +
        '</div>';
    }
    if (p.ozellikler){
      h += '<h3 style="margin:20px 0 10px">Özellikler ve notlar</h3>' +
        '<div class="kart"><p style="margin:0;font-size:.95rem;line-height:1.65">'+e(p.ozellikler)+'</p></div>';
    }
    h += '<p class="mini" style="margin-top:18px">Bilgiler kamuya açık kaynaklardan derlenmiştir.</p>';
    g.innerHTML = h;

    // Galeri mantığı
    if (p.gorseller && p.gorseller.length > 1){
      let aktif = 0;
      window.galeriAdim = function(yon){
        const resimler = g.querySelectorAll("[data-gi]");
        resimler[aktif].style.opacity = 0;
        aktif = (aktif + yon + resimler.length) % resimler.length;
        resimler[aktif].style.opacity = 1;
      };
    }
    return;
  }

  // Firma detay sayfası
  if (yol.id){
    const f = C.firmalar.find(x => x.id === yol.id);
    if (!f){ git({s:"firma"}, true); return; }

    let h = '<h1 style="margin:6px 0 4px">'+e(f.ad)+'</h1>' +

    // Hakkında
    h += '<div class="kart"><p style="margin:0;font-size:.97rem;line-height:1.65">'+e(f.bilgi).replace(/\n\n/g,'</p><p style="margin:10px 0 0;font-size:.97rem;line-height:1.65">')+'</p></div>';

    // Tarihçe
    if (f.tarihce && f.tarihce.length){

            '<div style="font-size:.93rem;line-height:1.55;color:var(--metin2)">'+e(t.olay)+'</div>' +
          '</div>').join("") +
        '</div>';
    }

    // Ürünler
    h += '<h3 style="margin:20px 0 10px">Ürünler</h3>';
    h += f.urunler.map((p,i) =>
      '<button class="kart" data-u="'+i+'" style="display:block;width:100%;text-align:left;margin-bottom:10px">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
          '<div style="min-width:0">' +
            '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px">' +
              '<span style="font-weight:600;font-size:1.02rem">'+e(p.ad)+'</span>' +
              '<span class="rozet" style="font-size:.73rem">'+e(p.tur)+'</span>' +
            '</div>' +
            '<div class="kucuk" style="line-height:1.5">'+e(p.ozet.substring(0,120))+(p.ozet.length>120?'…':'')+'</div>' +
          '</div>' +
          '<span style="color:var(--rota);flex-shrink:0;margin-top:2px">'+ikon("sag",20)+'</span>' +
        '</div>' +
      '</button>').join("");

    h += '<p class="mini" style="margin-top:6px">Bilgiler kamuya açık kaynaklardan derlenmiştir.</p>';
    g.innerHTML = h;

    g.querySelectorAll("[data-u]").forEach(b => b.addEventListener("click", () =>
      git({ s:"firma", id:yol.id, urun:+b.dataset.u })));
    return;
  }

  // Firma listesi
  g.innerHTML = '<h1 style="margin:6px 0 4px">Firmalar</h1>' +
    '<p class="kucuk" style="margin-bottom:16px">Türkiye\'nin öne çıkan savunma ve havacılık firmaları</p>' +
    '<div class="kart" style="padding:0 18px">' +
    C.firmalar.map(f =>
      '<button class="satir" data-f="'+f.id+'"><span style="min-width:0">' +
        '<span style="display:block;font-weight:500">'+e(f.ad)+'</span>' +
        '<span class="mini">'+e(f.alan)+' · '+f.urunler.length+' ürün</span></span>' +
        '<span style="color:var(--metin3);flex-shrink:0">'+ikon("sag",18)+'</span></button>').join("") +
    '</div>';
  g.querySelectorAll("[data-f]").forEach(b =>
    b.addEventListener("click", () => git({ s:"firma", id:b.dataset.f })));
}

        if (!k) return "";
        return '<button class="satir" data-kv="'+id+'">' +
          '<span style="min-width:0"><span style="display:block;font-weight:500">'+e(k.ad)+'</span>' +
          '<span class="mini">'+e(k.kategori)+'</span></span>'+ikon("sag",18)+'</button>';
      }).join("") + '</div>';
  }

  // Eksiklerim
  if (D.eksikler.length){
    h += '<h2 style="font-size:1.1rem;margin:20px 0 10px">Eksiklerim</h2>' +
      '<div class="kart" style="padding:0 18px">' +
      D.eksikler.slice(0,5).map(x =>
        '<button class="satir" data-ek="'+e(x.konu)+'">' +
        '<span style="min-width:0"><span style="display:block;font-weight:500">'+e(x.etiket)+'</span>' +
        '<span class="mini">'+e(x.konuAd)+'</span></span>'+ikon("sag",18)+'</button>').join("") +
      (D.eksikler.length > 5 ? '<button class="satir" id="tumeksik"><span>Tümünü gör</span>'+ikon("sag",18)+'</button>' : "") +
      '</div>';
  }

  // Ayarlar
  h += '<h2 style="font-size:1.1rem;margin:20px 0 10px">Ayarlar</h2>' +
    '<div class="kart" style="padding:0 18px">' +
      '<button class="satir" id="ab1"><span>Branşım</span><span class="kucuk">'+e(brans?brans.ad:"")+'</span></button>' +
      '<button class="satir" id="ab2"><span>Yazı boyutu</span><span class="kucuk">'+D.ayar.yazi+' pt</span></button>' +
      '<button class="satir" id="ab3"><span>Gizlilik ve veriler</span>'+ikon("sag",18)+'</button>' +
    '</div>' +
    '<div class="kart"><div class="kucuk">Uygulama</div>' +
      '<p class="mini" style="margin:6px 0 0">Sürüm '+e(C.surum)+' · '+e(C.guncelleme)+'<br>Ana ekrana ekli: '+(kurulu?"evet":"hayır")+'</p>' +
      (kurulu ? "" : '<button class="btn ikincil" id="kurb" style="margin-top:10px">Ana ekrana nasıl eklerim?</button>') +
    '</div>';

  g.innerHTML = h;

  // Not ekle
  el("not-ekle").addEventListener("click", () => notEkleAc());

  // Not sil
  g.querySelectorAll("[data-sil]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.sil;
    const notlar2 = Depo.al("mo.notlar", []);
    notlar2.splice(i, 1);
    Depo.yaz("mo.notlar", notlar2);
    ciz();
  }));

  // Kaydedilen kavrama git
  g.querySelectorAll("[data-kv]").forEach(b => b.addEventListener("click", () => kavramGoster(b.dataset.kv)));

  // Eksik konuya git
  g.querySelectorAll("[data-ek]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.ek;
    git(C.konuIcerik[id] ? { s:"konu", id:id } : { s:"gkkonu", id:id });
  }));
  const te = el("tumeksik"); if (te) te.addEventListener("click", () => git({ s:"eksik" }));

  // Ayarlar
  el("ab1").addEventListener("click", () => {
    ac('<h2>Branşını değiştir</h2><div style="margin-top:12px">' + C.branslar.map(b =>
      '<button class="satir" data-bb="'+b.id+'"><span>'+e(b.ad)+'</span>' +
      (b.id === D.brans ? '<span style="color:var(--rota)">'+ikon("onay",18)+'</span>' : "") + '</button>').join("") + '</div>');
    el("ortu").querySelectorAll("[data-bb]").forEach(b => b.addEventListener("click", () => {
      D.brans = b.dataset.bb; kaydet("brans"); kapat(); ciz();
    }));
  });
  el("ab2").addEventListener("click", yaziAyar);
  el("ab3").addEventListener("click", kvkkGoster);
  const kb = el("kurb"); if (kb) kb.addEventListener("click", kurulumGoster);
}

function notEkleAc(konuAdi){
  ac('<h2>Not ekle</h2>' +
    (konuAdi ? '<p class="mini" style="margin:4px 0 10px">'+e(konuAdi)+'</p>' : '<p class="mini" style="margin:4px 0 10px">Notun hangi konuyla ilgili?</p>') +
    '<label class="kucuk sr" for="not-konu">Konu (isteğe bağlı)</label>' +
    (!konuAdi ? '<input id="not-konu" placeholder="Konu (isteğe bağlı)" style="margin-bottom:10px">' : '<input id="not-konu" value="'+e(konuAdi)+'" style="display:none">') +
    '<label class="kucuk sr" for="not-metin">Notun</label>' +
    '<textarea id="not-metin" rows="5" style="resize:none;margin-bottom:4px" placeholder="Aklında kalanları yaz..."></textarea>' +
    '<div class="hata-m" id="not-hata" role="alert"></div>' +
    '<button class="btn" id="not-kaydet" style="margin-top:8px">Kaydet</button>' +
    '<button class="btn ikincil" onclick="window.__kapat()" style="margin-top:8px">Vazgeç</button>');
  el("not-kaydet").addEventListener("click", () => {
    const metin = el("not-metin").value.trim();
    if (!metin){ el("not-hata").textContent = "Bir şeyler yaz."; return; }
    const konu = el("not-konu").value.trim();
    const notlar = Depo.al("mo.notlar", []);
    const bugun2 = new Date().toLocaleDateString("tr-TR", { day:"numeric", month:"long" });
    notlar.push({ metin, konu, tarih: bugun2 });
    Depo.yaz("mo.notlar", notlar);
    kapat(); ciz();
  });
}

function notlarSayfa(g){
  git({ s:"ben" }, true);
}

/* ---------------- Başlat ---------------- */
if (D.kod){
  el("kapi").classList.add("gizli");
  el("uyg").classList.remove("gizli");
}
if (D.ayar.serif) document.body.style.fontFamily = "var(--font-b)";
ciz();

window.addEventListener("popstate", () => geri());
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
})();
</script>
</body>
</html>
